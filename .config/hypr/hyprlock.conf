general {
    hide_cursor = true
    ignore_empty_input = true
}

background {
    monitor =
    path = ~/.config/hypr/wallpaper.jpg
    color = rgba(25, 20, 20, 1.0)
    blur_passes = 2
}

input-field {
    monitor =
    size = 220, 46
    outline_thickness = 0
    dots_size = 0.28
    inner_color = rgba(44, 74, 62, 0.35)
    check_color = rgba(238, 252, 253, 0.6)
    fail_color = rgba(115, 79, 115, 0.8)
    fail_text = <span>$FAIL ($ATTEMPTS)</span>
    font_color = rgb(255, 255, 255)
    font_family = SSF Pro Text Semibold, Noto Sans Medium
    placeholder_text = <span font_weight="semibold">Enter the password</span>
    hide_input = false
    position = 0, -25%
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    color = rgba(255, 255, 255, 0.9)
    font_size = 90
    font_family = SF Pro Display Bold, Noto Sans Bold
    position = 0, -18%
    halign = center
    valign = top
}
